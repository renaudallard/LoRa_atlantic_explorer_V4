# Placeholder values. Fill in locally and do not commit the result.

wifi_ssid: "your-ssid"
wifi_password: "your-wifi-password"
fallback_ap_password: "change-me-8-chars-min"

# openssl rand -base64 32 (also encrypts OTA updates)
api_key: "REPLACE_WITH_BASE64_KEY"

# The hub's radio address: exactly 6 hex characters (openssl rand -hex 3).
# Replace it with the recovered value if you take the key from a Cozytouch bridge.
hub_node_id: "REPLACE_WITH_6_HEX"
# The installation key: exactly 32 hex characters (openssl rand -hex 16).
# Keep it private. Changing it later means pairing everything again.
hub_system_key: "REPLACE_WITH_32_HEX"

# The heater's address, printed by Discover & Pair or Scan Paired Devices.
explorer_io_device_id: "XXXXXX"
